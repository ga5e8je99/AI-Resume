<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonGradient" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <circle cx="50" cy="50" r="40" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 4" opacity="0.3"/>

  <!-- Letter J -->
  <path d="M32 24 H48 V56 C48 64 42 70 32 70 C24 70 18 64 18 56" 
        fill="none" 
        stroke="url(#neonGradient)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>
  <path d="M32 24 V32" 
        fill="none" 
        stroke="url(#neonGradient)" 
        stroke-width="5" 
        stroke-linecap="round"/>

  <!-- Letter M -->
  <path d="M48 50 L60 30 L72 50 L84 24 V70" 
        fill="none" 
        stroke="url(#neonGradient)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>

  <!-- Glowing AI Sparkle -->
  <circle cx="60" cy="30" r="3" fill="#ffffff"/>
  <circle cx="60" cy="30" r="5" fill="#22d3ee" opacity="0.4"/>
</svg>
